name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas de cálculo
        run: node --test
      - name: Sintaxis de los módulos del navegador
        run: for f in js/*.js; do node --check "$f"; done
